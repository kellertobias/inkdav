version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    groups:
      android-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      release-tooling:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
