name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Verify all four applications and BOOX dependencies
        run: >-
          ./gradlew --no-daemon
          :app:ktlintCheck :inkvault:ktlintCheck
          :app:testCalendarDebugUnitTest :app:testTodosDebugUnitTest :app:testFilesDebugUnitTest
          :inkvault:testDebugUnitTest :inkvault:verifyBooxDependencies
          :app:lintCalendarDebug :app:lintCalendarRelease
          :app:lintTodosDebug :app:lintTodosRelease
          :app:lintFilesDebug :app:lintFilesRelease
          :inkvault:lintDebug :inkvault:lintRelease
          :app:assembleCalendarDebug :app:assembleCalendarRelease
          :app:assembleTodosDebug :app:assembleTodosRelease
          :app:assembleFilesDebug :app:assembleFilesRelease
          :inkvault:assembleDebug :inkvault:assembleRelease

      - name: Verify BOOX-compatible APKs
        run: sh ./scripts/verify-ci-apks.sh

      - name: Upload InkVault test APK
        uses: actions/upload-artifact@v7
        with:
          name: inkvault-debug-${{ github.sha }}
          path: inkvault/build/outputs/apk/debug/inkvault-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload all four installable BOOX test APKs
        uses: actions/upload-artifact@v7
        with:
          name: inkdav-apps-debug-${{ github.sha }}
          path: dist/ci/*-main-boox-note-air5c-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Run migration and DAV contract tests on Android
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 300
          script: ./gradlew --no-daemon connectedCalendarDebugAndroidTest

  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compile for CodeQL
        run: >-
          ./gradlew --no-daemon
          :app:compileCalendarDebugKotlin :app:compileTodosDebugKotlin :app:compileFilesDebugKotlin
          :inkvault:compileDebugKotlin

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.9
