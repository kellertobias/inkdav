name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Verify and assemble
        run: ./gradlew --no-daemon ktlintCheck testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease

      - name: Verify BOOX-compatible APKs
        run: |
          ./scripts/verify-boox-apk.sh app/build/outputs/apk/release/app-release-unsigned.apk "" unsigned
          ./scripts/verify-boox-apk.sh app/build/outputs/apk/debug/app-debug.apk "" signed
          mkdir -p dist/ci
          cp app/build/outputs/apk/debug/app-debug.apk dist/ci/InkDAV-main-boox-note-air5c-debug.apk

      - name: Upload installable BOOX test APK
        uses: actions/upload-artifact@v7
        with:
          name: inkdav-debug-${{ github.sha }}
          path: dist/ci/InkDAV-main-boox-note-air5c-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Run migration and DAV contract tests on Android
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 300
          script: ./gradlew --no-daemon connectedDebugAndroidTest

  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compile for CodeQL
        run: ./gradlew --no-daemon compileDebugKotlin

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.9
