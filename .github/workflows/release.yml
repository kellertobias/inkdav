name: Release

on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: inkdav-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Check out the tested revision
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git checkout -B main "$TESTED_SHA"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Decode release signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.INKDAV_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/inkdav-release.p12"

      - name: Verify and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INKDAV_KEYSTORE_FILE: ${{ runner.temp }}/inkdav-release.p12
          INKDAV_KEYSTORE_TYPE: PKCS12
          INKDAV_KEYSTORE_PASSWORD: ${{ secrets.INKDAV_KEYSTORE_PASSWORD }}
          INKDAV_KEY_ALIAS: ${{ secrets.INKDAV_KEY_ALIAS }}
          INKDAV_KEY_PASSWORD: ${{ secrets.INKDAV_KEY_PASSWORD }}
        run: npm run release
